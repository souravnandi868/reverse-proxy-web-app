# Install in /etc/nginx/conf.d/ before applying managed proxies.
log_format proxy_admin escape=json '{"time":"$time_iso8601","source_ip":"$remote_addr","destination_fqdn":"$host","destination_server":"$upstream_addr","request":"$request","status":$status,"bytes":$body_bytes_sent,"request_time":$request_time,"user_agent":"$http_user_agent"}';
include /etc/nginx/conf.d/proxy-admin/*.conf;
