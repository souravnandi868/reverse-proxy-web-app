{% load static %}
<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Sign in | Proxy Control</title><link rel="stylesheet" href="{% static 'css/app.css' %}"><link rel="stylesheet" href="{% static 'css/console.css' %}"></head><body class="login-page"><section class="login-panel"><div class="brand"><span class="brand-mark">N</span><span><b>Reverse Proxy</b><small>Manager</small></span></div><span class="eyebrow">SECURE ADMINISTRATION</span><h1>Sign in to your control plane.</h1><p class="muted">Manage approved NGINX routes with an auditable, validated workflow.</p><form method="post">{% csrf_token %}{{ form.non_field_errors }}<label>Username{{ form.username }}</label><label>Password{{ form.password }}</label><button class="button primary wide" type="submit">Sign in</button><input type="hidden" name="next" value="{{ next }}"></form></section></body></html>
