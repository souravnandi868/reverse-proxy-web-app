{% extends 'base.html' %}{% load static %}
{% block title %}NGINX Server Resources | Proxy Control{% endblock %}
{% block heading %}NGINX Server Resources{% endblock %}
{% block extra_css %}<link rel="stylesheet" href="{% static 'css/servers.css' %}?v=3">{% endblock %}
{% block content %}
<section id="resource-monitor" data-url="{% url 'server_metrics' %}">
  <div class="panel monitor-toolbar"><div><h2>Reverse proxy host resources</h2></div><span id="monitor-status" role="status">Connecting…</span></div>
  <label class="graph-range" for="resource-range">Graph range <select id="resource-range"><option value="180" selected>Last 3 minutes</option><option value="300">Last 5 minutes</option><option value="0">All saved readings</option></select></label>
  <div id="server-cards"></div>
  <noscript><p>Enable JavaScript to display live resource graphs.</p></noscript>
</section>

{% endblock %}
